name: A1b runner availability smoke
on:
  push:
    branches:
      - experiment/a1b-node22-stopping
    paths:
      - .github/workflows/runner-smoke.yml

permissions:
  contents: read

jobs:
  linux-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm Linux job actually starts
        shell: bash
        run: echo A1B_LINUX_RUNNER_STARTED

  windows-runner:
    runs-on: windows-2022
    timeout-minutes: 2
    steps:
      - name: Confirm Windows job actually starts
        shell: pwsh
        run: Write-Output 'A1B_WINDOWS_RUNNER_STARTED'
